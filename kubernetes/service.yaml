# Kubernetes Service Manifests
# Kubernetes Service 清单
#
# Services 为访问 Pod 提供稳定的网络端点。
# 即使 Pod 被创建/销毁，Service 端点保持不变。
#
# 学习目标：
# - 理解 Service 类型（ClusterIP、NodePort、LoadBalancer）
# - 配置跨 Pod 的负载均衡
# - 通过 DNS 实现服务发现
# - 理解基于选择器的路由

# ============================================================================
# CLUSTERIP SERVICE（内部访问）
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: model-api-service
  namespace: ml-serving
  labels:
    app: model-api
    component: inference

  # 添加用于监控的注解
  # Prometheus 可以通过注解发现服务
  annotations:
    #  取消注释并设置正确的值：
    prometheus.io/scrape: "true"
    prometheus.io/port: "80"
    prometheus.io/path: "/metrics"

spec:
  # TODO: 设置 Service 类型为 ClusterIP
  # ClusterIP：Service 仅在集群内可访问（默认）
  # 使用场景：服务之间的内部通信
  type: "ClusterIP"  

  # ========================================================================
  # 选择器
  # ========================================================================

  #  配置选择器以匹配 Deployment Pod 标签
  # Service 将流量路由到匹配选择器中所有标签的 Pod
  selector:
    #  添加标签：app: model-api
    # 这必须与 deployment.yaml 中 template.metadata.labels 的标签匹配
    app: model-api

  # ========================================================================
  # 端口
  # ========================================================================

  ports:
  #  配置端口映射
  - name: http
    protocol: TCP

    # Port：Service 暴露的端口（客户端连接的端口）
    #  设置为 80（标准 HTTP 端口）
    port: 80  

    # TargetPort：Pod 上流量被转发到的端口
    #  设置为 5000（Flask 应用端口）
    # 也可以引用 Deployment 中的端口名称：targetPort: http
    targetPort: 5000  # TODO: 改为 5000

    # NodePort：（可选）在每个节点上暴露的端口（用于 NodePort/LoadBalancer 类型）
    # 范围：30000-32767
    # ClusterIP 类型保持未设置（删除此行）
    # nodePort: 30001  # 仅 NodePort/LoadBalancer 类型使用

  # ========================================================================
  # 会话亲和性（可选）
  # ========================================================================

  #  配置会话亲和性（无状态服务可选）
  # 选项：
  # - None：轮询负载均衡（默认，推荐用于无状态服务）
  # - ClientIP：来自同一客户端的请求路由到同一 Pod
  #
  # 对于 ML 推理（无状态），推荐使用 None
  #  sessionAffinity: None

  # 如果使用 ClientIP 会话亲和性，配置超时时间：
  # sessionAffinityConfig:
  #   clientIP:
  #     timeoutSeconds: 10800  # 3 小时

  # ========================================================================
  # IP 家族（IPv4/IPv6）
  # ========================================================================

  # TODO: 配置 IP 家族（可选，默认 IPv4）
  # ipFamilies:
  # - IPv4
  # ipFamilyPolicy: SingleStack

---

# ============================================================================
# LOADBALANCER SERVICE（外部访问）
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: model-api-lb
  namespace: ml-serving
  labels:
    app: model-api
    component: inference

  # TODO: 添加云提供商注解用于 LoadBalancer 配置
  # 不同的云提供商使用不同的注解
  annotations:
    # AWS EKS 注解（如果使用 AWS 请取消注释）：
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # 网络负载均衡器
    # service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "http"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443"
    # service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:..."

    # GCP GKE 注解（如果使用 GCP 请取消注释）：
    # cloud.google.com/load-balancer-type: "External"
    # cloud.google.com/backend-config: '{"default": "backend-config"}'

    # Azure AKS 注解（如果使用 Azure 请取消注释）：
    # service.beta.kubernetes.io/azure-load-balancer-internal: "false"

    # 腾讯云 TKE 注解（如果使用腾讯云请取消注释）：
    service.beta.kubernetes.io/qcloud-loadbalancer-type: "0"  # 0: 公网负载均衡，1: 内网负载均衡
    service.beta.kubernetes.io/qcloud-loadbalancer-protocol: "http"  # 监听器协议：http/https/tcp/udp
    service.beta.kubernetes.io/qcloud-loadbalancer-ports: "80"  # 负载均衡器端口
    # service.beta.kubernetes.io/qcloud-loadbalancer-bandwidth: "10"  # 带宽上限（Mbps），仅公网有效
    # service.beta.kubernetes.io/qcloud-loadbalancer-internal: "false"  # false: 公网，true: 内网
    # service.beta.kubernetes.io/qcloud-loadbalancer-scheduler: "wrr"  # 调度算法：wrr/least_conn/ip_hash
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check: "true"  # 是否启用健康检查
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check-type: "http"  # 健康检查类型：http/tcp
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check-path: "/health"  # 健康检查路径
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check-interval: "5"  # 健康检查间隔（秒）
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check-timeout: "2"  # 健康检查超时时间（秒）
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check-threshold: "3"  # 健康检查异常阈值
    # service.beta.kubernetes.io/qcloud-loadbalancer-health-check-healthy-threshold: "2"  # 健康检查正常阈值

spec:
  #  设置 Service 类型为 LoadBalancer
  # LoadBalancer：云提供商配置外部负载均衡器
  # 自动获取外部 IP 地址用于互联网访问
  type: "LoadBalancer"  # TODO: 设置为 LoadBalancer

  # ========================================================================
  # 选择器
  # ========================================================================

  # 配置选择器（与 ClusterIP Service 相同）
  selector:
    #  添加标签：app: model-api
    app: model-api
  # ========================================================================
  # 端口
  # ========================================================================

  ports:
  # HTTP 端口
  - name: http
    protocol: TCP
    #  设置外部端口为 80
    port: 80  # TODO: 改为 80
    #  设置目标端口为 5000
    targetPort: 5000  # TODO: 改为 5000

  # TODO: （可选）如果使用 SSL/TLS 添加 HTTPS 端口
  # - name: https
  #   protocol: TCP
  #   port: 443
  #   targetPort: 5000

  # ========================================================================
  # 负载均衡器配置
  # ========================================================================

  # TODO: 配置外部流量策略
  # 选项：
  # - Cluster：流量分发到任意节点，然后路由到 Pod（默认）
  # - Local：仅路由到接收节点上的 Pod（保留客户端 IP）
  #
  # 为了更好的负载分布，推荐使用 Cluster
  # externalTrafficPolicy: Cluster

  # TODO: 配置负载均衡器源地址范围（IP 白名单）
  # 限制访问到特定 IP 范围以提高安全性
  # loadBalancerSourceRanges:
  # - "203.0.113.0/24"  # 示例：办公室 IP 范围
  # - "198.51.100.0/24" # 示例：VPN IP 范围

  # TODO: 配置健康检查节点端口（用于 Local 流量策略）
  # healthCheckNodePort: 32000

---

