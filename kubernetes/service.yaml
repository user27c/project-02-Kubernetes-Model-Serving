# ============================================================================
# SERVICE 使用说明
# ============================================================================

# 1. 先应用 ConfigMap 和 Deployment（依赖项）：
#    kubectl apply -f configmap.yaml -n ml-serving
#    kubectl apply -f deployment.yaml -n ml-serving

# 2. 应用此 Service 清单：
#    kubectl apply -f service.yaml -n ml-serving

# 3. 验证 Services：
#    kubectl get svc -n ml-serving
#    kubectl describe svc model-api-service -n ml-serving
#    kubectl describe svc model-api-lb -n ml-serving

# 4. 检查 Service 端点（应列出 Pod IP）：
#    kubectl get endpoints model-api-service -n ml-serving
#    # 应显示 3 个端点（每个 Pod 一个）

# 5. 测试 ClusterIP Service（从集群内）：
#    kubectl run test-pod --image=curlimages/curl -it --rm -n ml-serving -- \
#      curl http://model-api-service/health

# 6. 测试 LoadBalancer Service（等待外部 IP）：
#    kubectl get svc model-api-lb -n ml-serving --watch
#    # 等待 EXTERNAL-IP 被分配（可能需要 1-2 分钟）
#
#    EXTERNAL_IP=$(kubectl get svc model-api-lb -n ml-serving -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
#    curl http://$EXTERNAL_IP/health

# 7. 对于 Minikube（没有真正的 LoadBalancer）：
#    minikube tunnel  # 在单独终端运行
#    # 这将在 localhost 上暴露 LoadBalancer 服务

# ============================================================================
# 服务发现
# ============================================================================

# Kubernetes 提供基于 DNS 的服务发现
# Service 可通过 DNS 名称访问：

# 在同一命名空间内：
#   curl http://model-api-service/health
#   curl http://model-api-service:80/health

# 从不同命名空间：
#   curl http://model-api-service.ml-serving/health
#   curl http://model-api-service.ml-serving.svc/health

# 完全限定域名（FQDN）：
#   curl http://model-api-service.ml-serving.svc.cluster.local/health

# DNS 格式：<service-name>.<namespace>.svc.cluster.local

# ============================================================================
# 负载均衡
# ============================================================================

# Services 如何分发流量：

# 1. ClusterIP Service：
#    - kube-proxy 在每个节点上创建 iptables 规则
#    - 到 Service IP 的流量随机分发到 Pod IP
#    - 算法：随机选择（实际上是轮询）
#    - 发生在网络层（对应用透明）

# 2. LoadBalancer Service：
#    - 云负载均衡器分发流量到节点 IP
#    - 每个节点上的 kube-proxy 分发到 Pod IP
#    - 两层负载均衡

# 3. 会话亲和性：
#    - 无：每个请求可能去往不同的 Pod（无状态）
#    - 使用 ClientIP：来自同一客户端的请求去往同一 Pod（有状态）

# ============================================================================
# 端点
# ============================================================================

# Kubernetes 自动管理 Endpoints 对象
# Endpoints 列出匹配 Service 选择器的所有 Pod IP

# 查看端点：
#   kubectl get endpoints model-api-service -n ml-serving -o yaml

# 示例输出：
# apiVersion: v1
# kind: Endpoints
# metadata:
#   name: model-api-service
# subsets:
# - addresses:
#   - ip: 10.244.1.5
#     targetRef:
#       name: model-api-7d8f9c6b4-abc12
#   - ip: 10.244.2.3
#     targetRef:
#       name: model-api-7d8f9c6b4-def34
#   ports:
#   - name: http
#     port: 5000
#     protocol: TCP

# ============================================================================
# 故障排查
# ============================================================================

# Service 无法访问：
#   1. 检查 Service 是否存在：
#      kubectl get svc model-api-service -n ml-serving
#
#   2. 检查选择器是否匹配 Pod：
#      kubectl get svc model-api-service -n ml-serving -o yaml | grep -A 2 selector
#      kubectl get pods -n ml-serving --show-labels
#
#   3. 检查端点是否已填充：
#      kubectl get endpoints model-api-service -n ml-serving
#      # 应列出 Pod IP。如果为空，选择器不匹配任何 Pod
#
#   4. 检查 Pod 是否就绪：
#      kubectl get pods -n ml-serving
#      # STATUS 应为 Running，READY 应为 1/1

# LoadBalancer EXTERNAL-IP 卡在 <pending>：
#   - Minikube：在单独终端运行 `minikube tunnel`
#   - 云环境：检查云提供商配额和权限
#   - 云环境：验证集群有权限创建负载均衡器

# 连接被拒绝：
#   1. 验证 Pod 正在监听正确的端口：
#      kubectl exec <pod-name> -n ml-serving -- netstat -tlnp
#
#   2. 从另一个 Pod 测试：
#      kubectl run debug --image=curlimages/curl -it --rm -n ml-serving -- \
#        curl http://<pod-ip>:5000/health

# ============================================================================
# 对比：Service 类型
# ============================================================================

# ClusterIP（默认）：
#   访问：仅内部（集群内）
#   使用：服务间通信
#   DNS：是
#   外部 IP：无
#   示例：数据库、缓存、内部 API

# NodePort：
#   访问：外部（通过 <NodeIP>:<NodePort>）
#   使用：开发、测试
#   DNS：是（内部）
#   外部 IP：无（使用节点 IP）
#   端口范围：30000-32767
#   示例：无需 LoadBalancer 成本的快速外部访问

# LoadBalancer：
#   访问：外部（通过云负载均衡器）
#   使用：生产环境外部服务
#   DNS：是（内部）+ 可以添加外部 DNS
#   外部 IP：是（由云提供商配置）
#   示例：公共 API、Web 服务

# ExternalName：
#   访问：映射到外部 DNS 名称
#   使用：通过 k8s DNS 访问外部服务
#   示例：外部数据库、第三方 API

